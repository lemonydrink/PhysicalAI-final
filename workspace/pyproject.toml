[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physicalai-xvla"
version = "0.1.0"
description = "2toINF X-VLA eight-task LIBERO simulation and ROS 2 bridge"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26,<2", "scipy>=1.15,<1.16", "pillow>=10", "huggingface-hub>=0.30,<1", "wandb>=0.24,<0.25"]

[project.optional-dependencies]
ml = ["torch==2.11.0", "torchvision==0.26.0", "transformers==4.51.3", "peft==0.17.1", "accelerate==1.2.1", "safetensors==0.4.5", "einops==0.8.1", "timm==1.0.12", "fastapi<1", "uvicorn==0.34.3", "json-numpy==2.1.0", "opencv-python-headless>=4.11,<4.12", "tensorboard>=2.17,<3", "av==15.0.0", "pyarrow==20.0.0", "h5py==3.12.1", "mmengine==0.10.5"]
sim = ["robosuite==1.4.0", "mujoco==3.7.0", "bddl", "easydict", "gym==0.25.2", "cloudpickle", "pyyaml", "imageio[ffmpeg]", "wand", "scikit-image"]
dev = ["pytest>=8,<9"]

[project.scripts]
vla = "physicalai_vla.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = {index = "pytorch-cu130"}
torchvision = {index = "pytorch-cu130"}

[tool.hatch.build.targets.wheel]
packages = ["src/physicalai_vla"]
